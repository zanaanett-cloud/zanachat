<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#075e54">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Keluarga Zana</title>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#075e54;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial,sans-serif;
      overflow:hidden;
    }

    .splash{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#fff;
      background:#075e54;
    }

    .logo{
      width:110px;
      height:110px;
      border-radius:24px;
      object-fit:contain;
      background:#fff;
      padding:10px;
      box-sizing:border-box;
      box-shadow:0 8px 30px rgba(0,0,0,.25);
    }

    .title{
      margin-top:20px;
      font-size:25px;
      font-weight:700;
    }

    .sub{
      margin-top:8px;
      font-size:14px;
      opacity:.85;
    }
  </style>
</head>

<body>
  <div class="splash">
    <img
      class="logo"
      src="/assets/zana-chat-icon.svg"
      alt="Keluarga Zana"
    >
    <div class="title">Keluarga Zana</div>
    <div class="sub">Chat • Telepon • Video Call</div>
  </div>

  <script>
    setTimeout(function(){
      window.location.href='https://chat.zananet.my.id';
    },500);
  </script>
  <script src="js/fcm-native.js"></script>
</body>
</html>
